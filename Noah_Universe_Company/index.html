<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전자계약서 서명 페이지</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 모바일 기기 서명 터치 시 스크롤 방지 */
        #signaturePad {
            touch-action: none;
        }
        canvas.empty { border-color: #ef4444; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans relative">
    <main class="max-w-3xl mx-auto bg-white my-0 md:my-8 shadow-lg md:rounded-lg overflow-hidden">
        
        <!-- 헤더 영역 -->
        <header class="bg-blue-900 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">전자계약서 서명</h1>
        </header>

        <div class="p-6 space-y-8">
            
            <!-- [계약 체결 및 효력 안내] 영역 -->
            <section class="bg-blue-50 border border-blue-200 rounded-lg p-5">
                <h2 class="text-lg font-bold text-blue-900 mb-2">[계약 체결 및 효력 안내]</h2>
                <p class="text-sm leading-relaxed text-gray-700">
                    본 계약은 서명 또는 날인을 통한 체결을 원칙으로 하나, 관련 법률에 의거하여 체크박스 동의, 메시지 내역, 결제 정보 제공을 통한 체결 의사 표시 역시 정식 서명 및 날인과 동일한 계약 체결 효력을 가집니다. 계약 내용을 충분히 확인하신 후 진행해 주시기 바랍니다.
                </p>
            </section>

            <!-- 계약서 이미지 뷰어 -->
            <section class="space-y-4 border border-gray-300 p-2 bg-gray-50 rounded-lg">
                <h3 class="font-semibold px-2 pt-2">계약서 내용 확인 <span class="text-xs text-gray-500 font-normal ml-2">(이미지를 클릭하면 확대됩니다)</span></h3>
                
                <!-- [변경됨] 이미지에 cursor-zoom-in, hover 효과 및 식별용 class(contract-img) 추가 -->
                <img src="https://rawcdn.githack.com/ADplanters/public/acb3ccee14abb198bf145dbd8f50cab2a98da332/Noah&AP%20contract_001.jpg?raw=true" alt="계약서 1페이지" class="contract-img w-full h-auto border shadow-sm cursor-zoom-in hover:opacity-90 transition-opacity">
                <img src="https://rawcdn.githack.com/ADplanters/public/acb3ccee14abb198bf145dbd8f50cab2a98da332/Noah&AP%20contract_002.jpg?raw=true" alt="계약서 2페이지" class="contract-img w-full h-auto border shadow-sm cursor-zoom-in hover:opacity-90 transition-opacity">
            </section>

            <!-- 서명 및 동의 영역 -->
            <section class="space-y-4 border-t pt-6">
                
                <!-- 고객 이메일 입력 필드 -->
                <div class="bg-gray-50 p-4 rounded-lg border mb-4">
                    <label for="customerEmail" class="font-semibold block mb-2 text-gray-800">
                        계약서 사본 수신 이메일 <span class="text-red-500">*</span>
                    </label>
                    <input type="email" id="customerEmail" placeholder="example@email.com" class="w-full border border-gray-300 rounded-md p-3 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required>
                    <p class="text-sm text-gray-500 mt-2">입력하신 이메일로 서명 완료된 계약서 사본이 발송됩니다. (발신자: 애드플랜터스.co)</p>
                </div>

                <!-- 동의 체크박스 -->
                <label class="flex items-center space-x-3 cursor-pointer bg-gray-50 p-4 rounded-lg border hover:bg-gray-100 transition">
                    <input type="checkbox" id="agreementCheckbox" class="w-6 h-6 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                    <span class="text-base font-medium">위 계약 체결 및 효력 안내에 동의하며 본 계약을 체결합니다.</span>
                </label>

                <!-- 서명 캔버스 영역 -->
                <div class="space-y-2">
                    <div class="flex justify-between items-end">
                        <label class="font-semibold block">서명 (마우스 또는 터치로 그려주세요) <span class="text-red-500">*</span></label>
                        <button type="button" id="clearSignatureBtn" class="text-sm text-gray-500 hover:text-red-500 underline">
                            지우기
                        </button>
                    </div>
                    <div class="border-2 border-gray-300 rounded-lg overflow-hidden bg-white">
                        <canvas id="signaturePad" class="w-full bg-white"></canvas>
                    </div>
                </div>
            </section>

            <!-- 제출 버튼 -->
            <button id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg py-4 rounded-lg shadow-md transition duration-200">
                계약 서명 완료 및 전송
            </button>
        </div>
    </main>

    <!-- [추가됨] 이미지 확대 표시를 위한 모달(Modal) 요소 -->
    <div id="imageModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-80 flex justify-center items-center p-4">
        <button id="closeModalBtn" class="absolute top-4 right-6 text-white text-4xl font-bold hover:text-gray-300 transition-colors">&times;</button>
        <img id="modalImage" src="" alt="확대된 계약서" class="max-w-full max-h-full rounded-md shadow-2xl">
    </div>

    <!-- 스크립트 영역: 캔버스 드로잉, 모달 제어 및 API 통신 로직 -->
    <script>
        // 1. DOM 요소 선택 (캔버스 및 입력폼)
        const canvas = document.getElementById('signaturePad');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearSignatureBtn');
        const submitBtn = document.getElementById('submitBtn');
        const emailInput = document.getElementById('customerEmail'); 
        
        let isDrawing = false;
        let hasSignature = false;
        let lastX = 0;
        let lastY = 0;

        // 반응형 캔버스 크기 지정
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = 200;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#000000';
            hasSignature = false; 
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 2. PC 마우스 이벤트 처리
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            [lastX, lastY] = [e.offsetX, e.offsetY];
        });
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);

        // 3. 모바일 터치 이벤트 처리
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            isDrawing = true;
            [lastX, lastY] = [touch.clientX - rect.left, touch.clientY - rect.top];
        }, { passive: false });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const currentX = touch.clientX - rect.left;
            const currentY = touch.clientY - rect.top;
            
            drawLine(lastX, lastY, currentX, currentY);
            [lastX, lastY] = [currentX, currentY];
            hasSignature = true;
        }, { passive: false });
        
        canvas.addEventListener('touchend', () => isDrawing = false);

        function draw(e) {
            if (!isDrawing) return;
            const currentX = e.offsetX;
            const currentY = e.offsetY;
            drawLine(lastX, lastY, currentX, currentY);
            [lastX, lastY] = [currentX, currentY];
            hasSignature = true;
        }

        function drawLine(x1, y1, x2, y2) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        // 캔버스 초기화 버튼
        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hasSignature = false;
        });

        // 이메일 형식 검증 함수
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        // ----------------------------------------------------
        // [추가됨] 4. 이미지 모달 처리 로직
        // ----------------------------------------------------
        const imageModal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const contractImages = document.querySelectorAll('.contract-img');

        // 각 이미지 클릭 시 모달 열기
        contractImages.forEach(img => {
            img.addEventListener('click', () => {
                modalImage.src = img.src; // 클릭한 이미지의 소스를 모달 이미지로 전달
                imageModal.classList.remove('hidden'); // 모달 보이기
                document.body.style.overflow = 'hidden'; // 배경 스크롤 방지
            });
        });

        // 모달 닫기 함수
        const closeModal = () => {
            imageModal.classList.add('hidden'); // 모달 숨기기
            modalImage.src = ''; 
            document.body.style.overflow = ''; // 배경 스크롤 복구
        };

        // 닫기 버튼 또는 배경 클릭 시 모달 닫기
        closeModalBtn.addEventListener('click', closeModal);
        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) {
                closeModal();
            }
        });


        // 5. API 전송 처리 로직
        submitBtn.addEventListener('click', async () => {
            const isAgreed = document.getElementById('agreementCheckbox').checked;
            const customerEmailValue = emailInput.value.trim(); 

            // 유효성 검사
            if (!customerEmailValue || !validateEmail(customerEmailValue)) {
                alert('유효한 수신용 이메일 주소를 입력해 주세요.');
                emailInput.focus();
                return;
            }
            if (!isAgreed) {
                alert('계약 체결 및 효력 안내에 동의해야 합니다.');
                return;
            }
            if (!hasSignature) {
                alert('서명을 진행해 주세요.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "전송 중...";
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');

            const signatureImageBase64 = canvas.toDataURL('image/png');
            
            // payload 데이터 구성
            const payload = {
                contractPages: [
                    "https://rawcdn.githack.com/ADplanters/public/acb3ccee14abb198bf145dbd8f50cab2a98da332/Noah&AP%20contract_001.jpg?raw=true",
                    "https://rawcdn.githack.com/ADplanters/public/acb3ccee14abb198bf145dbd8f50cab2a98da332/Noah&AP%20contract_002.jpg?raw=true"
                ],
                customerEmail: customerEmailValue,
                agreed: isAgreed,
                signatureImage: signatureImageBase64,
                submittedAt: new Date().toISOString()
            };

            try {
                const response = await fetch('https://adplanters.github.io/contracts/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('성공적으로 계약 서명이 완료되었습니다. 기재해주신 이메일로 사본이 발송됩니다.');
                    window.location.reload();
                } else {
                    throw new Error('서버 에러 발생');
                }
            } catch (error) {
                console.error('Error submitting contract:', error);
                alert('전송에 실패했습니다. 백엔드 API 주소를 확인해주세요.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "계약 서명 완료 및 전송";
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
