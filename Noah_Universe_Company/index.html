<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전자계약서 서명 페이지</title>
    <!-- 디자인 구성을 위한 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 모바일 기기에서 캔버스에 서명할 때 화면 스크롤 방지 */
        #signaturePad {
            touch-action: none;
        }
        /* 서명이 비어있는지 확인하기 위한 내부 플래그용 */
        canvas.empty { border-color: #ef4444; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <main class="max-w-3xl mx-auto bg-white my-0 md:my-8 shadow-lg md:rounded-lg overflow-hidden">
        
        <!-- 헤더 영역 -->
        <header class="bg-blue-900 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">전자계약서 서명</h1>
        </header>

        <div class="p-6 space-y-8">
            
            <!-- [계약 체결 및 효력 안내] 영역 -->
            <section class="bg-blue-50 border border-blue-200 rounded-lg p-5">
                <h2 class="text-lg font-bold text-blue-900 mb-2">[계약 체결 및 효력 안내]</h2>
                <p class="text-sm leading-relaxed text-gray-700">
                    본 계약은 서명 또는 날인을 통한 체결을 원칙으로 하나, 관련 법률에 의거하여 체크박스 동의, 메시지 내역, 결제 정보 제공을 통한 체결 의사 표시 역시 정식 서명 및 날인과 동일한 계약 체결 효력을 가집니다. 계약 내용을 충분히 확인하신 후 진행해 주시기 바랍니다.
                </p>
            </section>

            <!-- 계약서 이미지 뷰어 -->
            <section class="space-y-4 border border-gray-300 p-2 bg-gray-50 rounded-lg">
                <h3 class="font-semibold px-2 pt-2">계약서 내용 확인</h3>
                <img src="https://rawcdn.githack.com/ADplanters/public/acb3ccee14abb198bf145dbd8f50cab2a98da332/Noah&AP%20contract_001.jpg?raw=true" alt="계약서 1페이지" class="w-full h-auto border shadow-sm">
                <img src="https://rawcdn.githack.com/ADplanters/public/acb3ccee14abb198bf145dbd8f50cab2a98da332/Noah&AP%20contract_002.jpg?raw=true" alt="계약서 2페이지" class="w-full h-auto border shadow-sm">
            </section>

            <!-- 서명 및 동의 영역 -->
            <section class="space-y-4 border-t pt-6">
                <!-- 동의 체크박스 -->
                <label class="flex items-center space-x-3 cursor-pointer bg-gray-50 p-4 rounded-lg border hover:bg-gray-100 transition">
                    <input type="checkbox" id="agreementCheckbox" class="w-6 h-6 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                    <span class="text-base font-medium">위 계약 체결 및 효력 안내에 동의하며 본 계약을 체결합니다.</span>
                </label>

                <!-- 서명 캔버스 영역 -->
                <div class="space-y-2">
                    <div class="flex justify-between items-end">
                        <label class="font-semibold block">서명 (마우스 또는 터치로 그려주세요)</label>
                        <button type="button" id="clearSignatureBtn" class="text-sm text-gray-500 hover:text-red-500 underline">
                            지우기
                        </button>
                    </div>
                    <div class="border-2 border-gray-300 rounded-lg overflow-hidden bg-white">
                        <canvas id="signaturePad" class="w-full bg-white"></canvas>
                    </div>
                </div>
            </section>

            <!-- 제출 버튼 -->
            <button id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg py-4 rounded-lg shadow-md transition duration-200">
                계약 서명 완료 및 전송
            </button>
        </div>
    </main>

    <!-- 스크립트 영역: 캔버스 드로잉 및 API 통신 로직 -->
    <script>
        // 1. 캔버스 초기화 및 설정
        const canvas = document.getElementById('signaturePad');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearSignatureBtn');
        const submitBtn = document.getElementById('submitBtn');
        
        let isDrawing = false;
        let hasSignature = false;
        let lastX = 0;
        let lastY = 0;

        // 반응형 캔버스 리사이징 (해상도 매칭)
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = 200; // 서명 영역 높이 고정
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#000000';
            
            // 기존 서명이 있을 경우 지워짐 방지를 위한 로직이 필요하나, 
            // 가장 단순한 형태를 위해 리사이즈 시 초기화 처리합니다.
            hasSignature = false; 
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 2. 드로잉 이벤트 처리 (PC 마우스)
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            [lastX, lastY] = [e.offsetX, e.offsetY];
        });
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);

        // 3. 드로잉 이벤트 처리 (모바일 터치)
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // 스크롤 방지
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            isDrawing = true;
            [lastX, lastY] = [touch.clientX - rect.left, touch.clientY - rect.top];
        }, { passive: false });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const currentX = touch.clientX - rect.left;
            const currentY = touch.clientY - rect.top;
            
            drawLine(lastX, lastY, currentX, currentY);
            [lastX, lastY] = [currentX, currentY];
            hasSignature = true;
        }, { passive: false });
        
        canvas.addEventListener('touchend', () => isDrawing = false);

        // 드로잉 실제 함수
        function draw(e) {
            if (!isDrawing) return;
            const currentX = e.offsetX;
            const currentY = e.offsetY;
            drawLine(lastX, lastY, currentX, currentY);
            [lastX, lastY] = [currentX, currentY];
            hasSignature = true;
        }

        function drawLine(x1, y1, x2, y2) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        // 지우기 버튼 동작
        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hasSignature = false;
        });

        // 4. API 전송 (제출) 로직
        submitBtn.addEventListener('click', async () => {
            const isAgreed = document.getElementById('agreementCheckbox').checked;

            // 유효성 검사
            if (!isAgreed) {
                alert('계약 체결 및 효력 안내에 동의해야 합니다.');
                return;
            }
            if (!hasSignature) {
                alert('서명을 진행해 주세요.');
                return;
            }

            // 전송 중 버튼 상태 변경
            submitBtn.disabled = true;
            submitBtn.innerText = "전송 중...";
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');

            // DB에 연동할 데이터 구성 (Base64 이미지 데이터 포함)
            const signatureImageBase64 = canvas.toDataURL('image/png');
            const payload = {
                contractPages: [
                    "https://rawcdn.githack.com/ADplanters/public/acb3ccee14abb198bf145dbd8f50cab2a98da332/Noah&AP%20contract_001.jpg?raw=true",
                    "https://rawcdn.githack.com/ADplanters/public/acb3ccee14abb198bf145dbd8f50cab2a98da332/Noah&AP%20contract_002.jpg?raw=true"
                ],
                agreed: isAgreed,
                signatureImage: signatureImageBase64,
                submittedAt: new Date().toISOString()
            };

            try {
                // 요구하신 DB API 엔드포인트로 POST 요청 발송
                const response = await fetch('https://admin.placepartner.cloud/contracts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('성공적으로 계약 서명이 완료되었습니다.');
                    // 서명 완료 후 페이지 리디렉션 또는 초기화
                    window.location.reload();
                } else {
                    throw new Error('서버 에러 발생');
                }
            } catch (error) {
                console.error('Error submitting contract:', error);
                alert('전송에 실패했습니다. 관리자에게 문의해주세요.');
            } finally {
                // 버튼 상태 복원
                submitBtn.disabled = false;
                submitBtn.innerText = "계약 서명 완료 및 전송";
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
